apiVersion: feast.dev/v1
kind: FeatureStore
metadata:
  name: cpl-features
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
    feature-store-ui: enabled
  annotations:
    argocd.argoproj.io/sync-wave: "25"
    # The feast.dev CRD doesn't exist until the enable-feast job (wave 10) has
    # run, so skip the up-front dry run that would otherwise fail the sync.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  feastProject: cpl_coverage
  feastProjectDir:
    git:
      url: {{ .Values.git.repoURL }}
      ref: {{ .Values.git.ref }}
      featureRepoPath: feast
  services:
    registry:
      local:
        server:
          restAPI: true
    ui: {}
  authz:
    noAuth: true
