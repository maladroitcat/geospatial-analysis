{{- if and .Values.mcpServer.enabled .Values.mcpServer.aiHub.enabled }}
# Adds the CPL MCP server to the AI hub's MCP catalog. (The catalog page itself
# is switched on by the enable-components job, which merge-patches the
# dashboard config: applying that shared object here would let Argo CD drop
# settings it doesn't list.)
#
# This ConfigMap is shared OpenShift AI configuration, so Argo CD applies it
# server-side and owns only the keys written here. Prune=false and
# Delete=false keep it if this template leaves the chart or the app is removed. Argo CD needs the grant in argocd/rbac.yaml.
---
# User MCP catalog sources, read by the model catalog service. sources.yaml
# lists the catalogs; the second key is our catalog file, which appears beside
# it at /data/user-mcp-sources in the catalog pod.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mcp-catalog-sources
  namespace: {{ .Values.mcpServer.aiHub.catalogNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "46"
    argocd.argoproj.io/sync-options: ServerSideApply=true,Prune=false,Delete=false
data:
  sources.yaml: |-
    mcp_catalogs:
      - name: CPL Coverage
        id: cpl_coverage_mcp
        type: yaml
        enabled: true
        properties:
          yamlCatalogPath: /data/user-mcp-sources/cpl-coverage-mcp-catalog.yaml
  cpl-coverage-mcp-catalog.yaml: |-
    {{- tpl (.Files.Get "files/mcp-catalog/cpl-coverage.yaml") . | nindent 4 }}
{{- end }}
