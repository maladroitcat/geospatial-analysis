apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cpl-coverage.name" . }}-create-data-connection
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    # A Sync hook in wave 5 (after the bucket claim and this job's RBAC in
    # wave 0) rather than PostSync: the workbenches in wave 40 can't start
    # without cpl-s3, and PostSync hooks only run once every resource in the
    # app is healthy, so one unrelated failing workload would block them.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "cpl-coverage.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: data-connection-creator
      containers:
        - name: create
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/sh
            - -c
            - |
              # The bucket provisioner fills in the claim's secret shortly
              # after the claim is created; wait for it.
              for i in $(seq 1 60); do
                ACCESS_KEY=$(oc get secret {{ .Values.s3.bucketName }} -o jsonpath='{.data.AWS_ACCESS_KEY_ID}' 2>/dev/null)
                [ -n "$ACCESS_KEY" ] && break
                echo "Waiting for bucket credentials... ($i/60)"
                sleep 5
              done
              if [ -z "$ACCESS_KEY" ]; then
                echo "ERROR: bucket credentials not provisioned"
                exit 1
              fi
              ACCESS_KEY=$(oc get secret {{ .Values.s3.bucketName }} -o jsonpath='{.data.AWS_ACCESS_KEY_ID}')
              SECRET_KEY=$(oc get secret {{ .Values.s3.bucketName }} -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}')

              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: cpl-s3
                labels:
                  opendatahub.io/dashboard: "true"
                  opendatahub.io/managed: "true"
                annotations:
                  opendatahub.io/connection-type: s3
                  openshift.io/display-name: CPL Data
              type: Opaque
              data:
                AWS_ACCESS_KEY_ID: ${ACCESS_KEY}
                AWS_SECRET_ACCESS_KEY: ${SECRET_KEY}
              stringData:
                AWS_S3_ENDPOINT: https://s3.openshift-storage.svc:443
                AWS_S3_BUCKET: {{ .Values.s3.bucketName }}
                AWS_DEFAULT_REGION: us-east-1
              EOSECRET
              echo "Data connection cpl-s3 created."
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-connection-creator
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-connection-creator
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-connection-creator
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-connection-creator
subjects:
  - kind: ServiceAccount
    name: data-connection-creator
