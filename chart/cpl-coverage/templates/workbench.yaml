apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: pipelines
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    opendatahub.io/image-display-name: Standard Data Science
    notebooks.opendatahub.io/inject-oauth: "true"
    notebooks.opendatahub.io/oauth-logout-url: ""
    openshift.io/display-name: pipelines
    argocd.argoproj.io/sync-wave: "40"
spec:
  template:
    spec:
      initContainers:
        - name: copy-notebooks
          image: registry.access.redhat.com/ubi9/python-312
          command:
            - /bin/bash
            - -c
            - |
              for nb in 01_cleaning_pipeline.ipynb 02_fetch_isochrones.ipynb 03_compute_coverage.ipynb 04_aggregate_scores.ipynb 05_coverage_model.ipynb; do
                if ! cmp -s /notebooks/$nb /opt/app-root/src/$nb; then
                  cp /notebooks/$nb /opt/app-root/src/
                  echo "Updated $nb"
                else
                  echo "$nb unchanged, skipping."
                fi
              done
          volumeMounts:
            - name: notebooks
              mountPath: /notebooks
            - name: workspace
              mountPath: /opt/app-root/src
      containers:
        - name: pipelines
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2025.2
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          env:
            - name: NOTEBOOK_ARGS
              value: "--NotebookApp.token='' --NotebookApp.password='' --ServerApp.port=8888 --ServerApp.base_url=/notebook/{{ .Values.namespace }}/pipelines"
          envFrom:
            - secretRef:
                name: cpl-s3
            - secretRef:
                name: pipeline-url
                optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pipelines-pvc
        - name: notebooks
          configMap:
            name: notebook-files
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipelines-pvc
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
