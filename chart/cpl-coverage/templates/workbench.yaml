apiVersion: kubeflow.org/v1
kind: Notebook
metadata:
  name: pipelines
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
    opendatahub.io/dashboard: "true"
    opendatahub.io/odh-managed: "true"
  annotations:
    opendatahub.io/image-display-name: Standard Data Science
    notebooks.opendatahub.io/inject-oauth: "true"
    notebooks.opendatahub.io/oauth-logout-url: ""
    openshift.io/display-name: pipelines
spec:
  template:
    spec:
      containers:
        - name: pipelines
          image: image-registry.openshift-image-registry.svc:5000/redhat-ods-applications/s2i-generic-data-science-notebook:2025.2
          resources:
            requests:
              cpu: "1"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 8Gi
          ports:
            - containerPort: 8888
              name: notebook-port
              protocol: TCP
          env:
            - name: NOTEBOOK_ARGS
              value: --NotebookApp.token='' --NotebookApp.password='' --ServerApp.port=8888
          envFrom:
            - secretRef:
                name: cpl-s3
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: pipelines-pvc
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: pipelines
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
    notebook-name: pipelines
  annotations:
    haproxy.router.openshift.io/rewrite-target: /
spec:
  to:
    kind: Service
    name: pipelines-kube-rbac-proxy
    weight: 100
  port:
    targetPort: kube-rbac-proxy
  tls:
    termination: reencrypt
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pipelines-pvc
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
