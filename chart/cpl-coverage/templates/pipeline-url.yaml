apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cpl-coverage.name" . }}-pipeline-url
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "30"
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        {{- include "cpl-coverage.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: data-connection-creator
      containers:
        - name: get-url
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/sh
            - -c
            - |
              for i in $(seq 1 30); do
                ROUTE=$(oc get route ds-pipeline-dspa -o jsonpath='{.spec.host}' 2>/dev/null)
                if [ -n "$ROUTE" ]; then
                  break
                fi
                echo "Waiting for DSPA route... ($i/30)"
                sleep 10
              done

              if [ -z "$ROUTE" ]; then
                echo "ERROR: DSPA route not found after 5 minutes"
                exit 1
              fi

              PIPELINE_URL="https://${ROUTE}"
              echo "DSPA route: ${PIPELINE_URL}"

              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: pipeline-url
              type: Opaque
              stringData:
                PIPELINES_URL: ${PIPELINE_URL}
              EOSECRET
              echo "pipeline-url secret created."
