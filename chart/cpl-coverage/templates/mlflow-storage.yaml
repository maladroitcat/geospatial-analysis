{{- if .Values.mlflow.configureS3Artifacts }}
# MLflow ships configured to write artifacts to its own PVC, which KServe and
# the model-serving dashboard cannot read. These resources repoint it at object
# storage so logged models land somewhere servable.
#
# The MLflow CR is cluster-scoped and shared by every project, so it is patched
# by a Job rather than managed declaratively -- if two Applications both owned
# that CR, ArgoCD selfHeal would fight over it.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: mlflow-artifacts
  namespace: {{ .Values.mlflow.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generateBucketName: mlflow-artifacts
  storageClassName: {{ .Values.s3.bucketClass }}
---
# The S3 endpoint presents an OpenShift service-serving cert. botocore rejects
# it unless the service CA is in the bundle MLflow trusts; this annotation makes
# OpenShift populate service-ca.crt, and the operator merges it in.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mlflow-s3-ca
  namespace: {{ .Values.mlflow.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    service.beta.openshift.io/inject-cabundle: "true"
    argocd.argoproj.io/sync-wave: "0"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mlflow-storage-configurer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Values.namespace }}-mlflow-storage-configurer
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
rules:
  # The MLflow CR is cluster-scoped, so this one has to be a ClusterRole.
  # Secret access is granted separately and only in the MLflow namespace.
  - apiGroups: ["mlflow.opendatahub.io"]
    resources: ["mlflows"]
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Values.namespace }}-mlflow-storage-configurer
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Values.namespace }}-mlflow-storage-configurer
subjects:
  - kind: ServiceAccount
    name: mlflow-storage-configurer
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mlflow-storage-configurer
  namespace: {{ .Values.mlflow.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mlflow-storage-configurer
  namespace: {{ .Values.mlflow.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mlflow-storage-configurer
subjects:
  - kind: ServiceAccount
    name: mlflow-storage-configurer
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "cpl-coverage.name" . }}-configure-mlflow-storage
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 5
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "cpl-coverage.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: mlflow-storage-configurer
      containers:
        - name: configure
          image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
          command:
            - /bin/sh
            - -c
            - |
              set -e
              NS={{ .Values.mlflow.namespace }}

              # The bucket name is generated, so wait for the provisioner.
              for i in $(seq 1 30); do
                BUCKET=$(oc get cm mlflow-artifacts -n ${NS} -o jsonpath='{.data.BUCKET_NAME}' 2>/dev/null || true)
                [ -n "${BUCKET}" ] && break
                echo "waiting for mlflow-artifacts bucket... (${i}/30)"
                sleep 5
              done
              if [ -z "${BUCKET}" ]; then
                echo "ERROR: mlflow-artifacts bucket not provisioned"
                exit 1
              fi
              echo "bucket: ${BUCKET}"

              ACCESS_KEY=$(oc get secret mlflow-artifacts -n ${NS} -o jsonpath='{.data.AWS_ACCESS_KEY_ID}')
              SECRET_KEY=$(oc get secret mlflow-artifacts -n ${NS} -o jsonpath='{.data.AWS_SECRET_ACCESS_KEY}')

              # MLflow looks for MLFLOW_S3_ENDPOINT_URL specifically; the
              # AWS_S3_ENDPOINT used elsewhere in this chart is not read by it.
              cat <<EOSECRET | oc apply -f -
              apiVersion: v1
              kind: Secret
              metadata:
                name: mlflow-models
                namespace: ${NS}
              type: Opaque
              data:
                AWS_ACCESS_KEY_ID: ${ACCESS_KEY}
                AWS_SECRET_ACCESS_KEY: ${SECRET_KEY}
              stringData:
                AWS_DEFAULT_REGION: us-east-1
                AWS_S3_BUCKET: ${BUCKET}
                MLFLOW_S3_ENDPOINT_URL: {{ .Values.mlflow.s3EndpointUrl }}
              EOSECRET

              oc patch mlflow {{ .Values.mlflow.instanceName }} --type=merge -p \
                "{\"spec\":{\"artifactsDestination\":\"s3://${BUCKET}/mlflow-artifacts\",\"envFrom\":[{\"secretRef\":{\"name\":\"mlflow-models\"}}],\"caBundleConfigMap\":{\"name\":\"mlflow-s3-ca\"}}}"

              echo "MLflow artifacts now at s3://${BUCKET}/mlflow-artifacts"
{{- end }}
