{{- if .Values.mcpServer.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cpl-coverage-mcp
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "45"
{{- if .Values.mcpServer.imagePullSecret }}
imagePullSecrets:
  - name: {{ .Values.mcpServer.imagePullSecret }}
{{- end }}
---
# The model endpoint sits behind kube-rbac-proxy, which authorizes callers with
# a SubjectAccessReview for "get" on the InferenceService. Granting that to this
# ServiceAccount lets the pod authenticate with its own token instead of a
# static credential copied into a Secret.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cpl-coverage-mcp-model-caller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "45"
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    resourceNames: [{{ .Values.mcpServer.modelName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cpl-coverage-mcp-model-caller
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "45"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cpl-coverage-mcp-model-caller
subjects:
  - kind: ServiceAccount
    name: cpl-coverage-mcp
    namespace: {{ .Values.namespace }}
---
# Reference data the server answers from: tract centroids, areas and population,
# and current coverage per tract and travel mode. Shipped with the chart so the
# MCPServer below can mount it; MCPServer storage takes ConfigMaps and Secrets.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cpl-coverage-mcp-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "44"
binaryData:
  tracts.parquet: {{ .Files.Get "files/mcp-data/tracts.parquet" | b64enc }}
  coverage_scores.parquet: {{ .Files.Get "files/mcp-data/coverage_scores.parquet" | b64enc }}
---
# Deployed through OpenShift AI's MCP lifecycle operator so it appears under
# AI hub -> MCP servers. The operator creates the Deployment and a Service
# named after this resource.
apiVersion: mcp.x-k8s.io/v1alpha1
kind: MCPServer
metadata:
  name: {{ .Values.mcpServer.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "cpl-coverage.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "45"
    # The CRD only exists once the enable-components job (wave 10) has run.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  source:
    type: ContainerImage
    containerImage:
      ref: {{ .Values.mcpServer.image }}
  config:
    port: {{ .Values.mcpServer.port }}
    path: /mcp
    env:
      - name: MCP_PORT
        value: {{ .Values.mcpServer.port | quote }}
      - name: MODEL_NAME
        value: {{ .Values.mcpServer.modelName | quote }}
      # Internal service, so traffic never leaves the cluster and does not
      # depend on the external route existing.
      - name: MODEL_ENDPOINT
        value: "https://{{ .Values.mcpServer.modelName }}-predictor.{{ .Values.namespace }}.svc:8443"
      - name: DATA_DIR
        value: /data
    storage:
      - path: /data
        permissions: ReadOnly
        source:
          type: ConfigMap
          configMap:
            name: cpl-coverage-mcp-data
  runtime:
    replicas: {{ .Values.mcpServer.replicaCount }}
    resources:
      {{- toYaml .Values.mcpServer.resources | nindent 6 }}
    security:
      serviceAccountName: cpl-coverage-mcp
{{- end }}
