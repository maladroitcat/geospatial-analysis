namespace: cpl-coverage

git:
  repoURL: https://github.com/maladroitcat/geospatial-analysis.git
  ref: geospatial_analysis

s3:
  bucketName: cpl-coverage-data
  bucketClass: openshift-storage.noobaa.io

seed:
  enabled: true

mcpServer:
  enabled: true
  image: quay.io/rh-ee-vreynold/cpl-coverage-mcp:0.2.0
  # Reference data is mounted from the model image, so this tag pins both the
  # model being called and the tract data used to build its inputs.
  modelImage: quay.io/rh-ee-vreynold/cpl-coverage-model:1.0.2
  modelName: cov-1
  imagePullSecret: quay-push
  replicaCount: 1
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mlflow:
  # Repoint the shared MLflow instance's artifact store from its PVC to object
  # storage, so logged models are reachable by KServe. Cluster-wide effect.
  configureS3Artifacts: true
  namespace: redhat-ods-applications
  instanceName: mlflow
  s3EndpointUrl: https://s3.openshift-storage.svc

secrets:
  mapboxToken: "pk.eyJ1IjoiYWJieXJleW5vbGRzODgiLCJhIjoiY2xqZXBiZzB6MjlzZjNlc2NqNm5ycnZuaSJ9.WrtemsZEU3cK8U-LZUDf7Q"
  censusApiKey: ""
