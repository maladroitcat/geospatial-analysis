namespace: cpl-coverage

git:
  repoURL: https://github.com/maladroitcat/geospatial-analysis.git
  ref: geospatial_demo

s3:
  bucketName: cpl-coverage-data
  bucketClass: openshift-storage.noobaa.io

seed:
  enabled: true

mcpServer:
  enabled: true
  # Name of the MCPServer resource; the operator names its Service after it.
  name: cpl-coverage
  image: quay.io/rh-ee-vreynold/cpl-coverage-mcp:0.3.1
  # Image the model endpoint (cov-1) can be deployed from. The MCP server's
  # own reference data ships with the chart (files/mcp-data).
  modelImage: quay.io/rh-ee-vreynold/cpl-coverage-model:1.0.2
  modelName: cov-1
  # Both images are public on Quay, so no pull secret is needed.
  imagePullSecret: ""
  # List the server in AI hub -> MCP servers: turns on the dashboard's MCP
  # catalog page and adds a catalog entry (templates/ai-hub-mcp.yaml).
  aiHub:
    enabled: true
    catalogNamespace: rhoai-model-registries
  # Also list it in Gen AI studio's MCP servers (templates/gen-ai-mcp-servers.yaml).
  dashboard:
    register: true
    namespace: redhat-ods-applications
    description: >-
      Chicago Public Library coverage. Predict how much of each census tract a
      new branch at given coordinates would reach on foot, by bike or by car;
      summarize current coverage; find underserved tracts; and look up tracts
      by name or ID.
  replicaCount: 1
  port: 8000
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

mlflow:
  # Repoint the shared MLflow instance's artifact store from its PVC to object
  # storage, so logged models are reachable by KServe. Cluster-wide effect.
  configureS3Artifacts: true
  namespace: redhat-ods-applications
  instanceName: mlflow
  s3EndpointUrl: https://s3.openshift-storage.svc

secrets:
  mapboxToken: "pk.eyJ1IjoiYWJieXJleW5vbGRzODgiLCJhIjoiY2xqZXBiZzB6MjlzZjNlc2NqNm5ycnZuaSJ9.WrtemsZEU3cK8U-LZUDf7Q"
  censusApiKey: ""
